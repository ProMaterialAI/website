<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>制造业 KPI 管理报告 Demo</title>
<style>
:root{
  --bg:#f7f8fa;--panel:#fff;--text:#222b35;--muted:#667085;--line:#e6e9ee;
  --blue:#3973b7;--blue2:#90bdd8;--orange:#d9a05d;--red:#c78080;--teal:#86c1c0;
  --dark:#25313e;--goal:#7a7f87;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",Arial,sans-serif}
.header{
  height:66px;background:white;border-bottom:1px solid var(--line);display:flex;align-items:center;
  justify-content:space-between;padding:0 30px;position:sticky;top:0;z-index:10
}
.brand{display:flex;gap:13px;align-items:center}
.logo{width:34px;height:34px;border-radius:7px;background:var(--dark);color:#fff;display:grid;place-items:center;font-weight:750}
.brand h1{font-size:18px;margin:0}
.brand p{font-size:12px;color:var(--muted);margin:3px 0 0}
.badge{font-size:11px;border:1px solid var(--line);padding:5px 8px;border-radius:999px;color:var(--muted)}
.main{max-width:1580px;margin:0 auto;padding:22px 30px 38px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow:auto}
.tab{
  border:0;background:transparent;padding:12px 18px;cursor:pointer;font-size:14px;color:#697586;
  border-bottom:3px solid transparent;white-space:nowrap
}
.tab.active{color:var(--text);font-weight:700;border-bottom-color:var(--blue)}
.toolbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;gap:12px;flex-wrap:wrap}
.toolbar .period{color:var(--muted);font-size:12px}
.toolbar select,.toolbar button{
  border:1px solid var(--line);background:#fff;border-radius:6px;padding:7px 10px;color:#475467;font:inherit
}
.kpi-layout{display:grid;grid-template-columns:minmax(290px,360px) minmax(0,1fr);gap:18px;align-items:stretch}
.info-panel,.chart-panel{background:#fff;border:1px solid var(--line);border-radius:8px}
.info-panel{padding:24px 22px;min-height:650px}
.kpi-no{font-size:13px;color:var(--muted);font-weight:700;margin-bottom:8px}
.info-panel h2{font-size:23px;line-height:1.28;margin:0 0 18px;letter-spacing:-.2px}
.target-line{font-size:14px;color:#475467;margin-bottom:16px}
.target-line b{font-size:25px;color:var(--blue);margin-left:6px}
.result-box{border-left:4px solid var(--red);background:#fbf7f7;padding:13px 14px;margin-bottom:20px}
.result-box.good{border-color:#4a9667;background:#f4faf6}
.result-box.warning{border-color:#d2a04e;background:#fffaf0}
.result-box label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.result-main{font-size:23px;font-weight:760}
.result-sub{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.55}
.block{margin-top:22px}
.block h3{font-size:14px;margin:0 0 8px}
.block p{font-size:12px;line-height:1.65;color:#4f5d6c;margin:0}
.formula{font-size:12px;line-height:1.7;color:#4f5d6c;padding:10px 11px;background:#f7f9fb;border:1px solid #edf0f3;border-radius:6px}
.watch-list{margin:0;padding-left:18px;color:#4f5d6c;font-size:12px;line-height:1.8}
.deep-title{font-size:13px;font-weight:700;margin-bottom:9px}
.deep-buttons{display:flex;flex-wrap:wrap;gap:7px}
.deep-buttons button{
  border:1px solid #cfd6df;background:#fff;color:#4a5868;border-radius:5px;padding:7px 9px;cursor:pointer;font-size:12px
}
.deep-buttons button:hover{background:#f5f8fb;border-color:#9fb2c7}
.chart-panel{padding:18px 18px 14px;min-height:650px}
.chart-head{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;margin-bottom:8px}
.chart-head h3{font-size:14px;margin:0}
.chart-head p{font-size:11px;color:var(--muted);margin:4px 0 0}
.legend{display:flex;gap:13px;flex-wrap:wrap;font-size:11px;color:#5f6b7a;justify-content:flex-end}
.legend span{white-space:nowrap}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px}
.chart-wrap{height:550px;position:relative}
canvas{width:100%;height:100%}
.chart-note{font-size:11px;color:var(--muted);text-align:right;margin-top:6px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(20,28,38,.30);z-index:30;padding:5vh 6vw}
.modal{background:#fff;max-width:980px;margin:0 auto;border-radius:9px;box-shadow:0 18px 60px rgba(0,0,0,.18);max-height:90vh;overflow:auto}
.modal-head{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;padding:20px 22px;border-bottom:1px solid var(--line)}
.modal-head h3{margin:0;font-size:18px}
.modal-head p{margin:4px 0 0;font-size:12px;color:var(--muted)}
.close{border:1px solid var(--line);background:white;border-radius:6px;width:34px;height:34px;font-size:20px;cursor:pointer}
.modal-body{padding:20px 22px}
.summary-row{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.summary-card{border:1px solid var(--line);border-radius:7px;padding:11px}
.summary-card label{font-size:11px;color:var(--muted);display:block}
.summary-card b{font-size:20px;display:block;margin-top:5px}
table{width:100%;border-collapse:collapse}
th{text-align:left;font-size:11px;color:var(--muted);background:#fafbfc;border-bottom:1px solid var(--line);padding:10px}
td{font-size:12px;border-bottom:1px solid #edf0f2;padding:11px 10px}
.barcell{width:250px}
.mini-bar{height:7px;background:#eef1f4;border-radius:999px;overflow:hidden}
.mini-bar div{height:100%;background:#7c91a8}
.rank{font-weight:750;color:#5f6b7a}
@media(max-width:980px){
  .kpi-layout{grid-template-columns:1fr}
  .info-panel{min-height:auto}
  .chart-panel{min-height:550px}
  .chart-wrap{height:450px}
}
@media(max-width:620px){
  .main{padding:16px}.header{padding:0 16px}.brand p{display:none}
  .summary-row{grid-template-columns:1fr}.barcell{width:auto}
}
</style>
</head>
<body>
<header class="header">
  <div class="brand">
    <div class="logo">MI</div>
    <div><h1>制造业 KPI 管理报告</h1><p>公司级指标总览与分层下钻演示</p></div>
  </div>
  <span class="badge">演示数据</span>
</header>

<main class="main">
  <nav class="tabs" id="tabs"></nav>
  <div class="toolbar">
    <div class="period">报告周期：2026 年第 1–48 周</div>
    <div>
      <select><option>全公司</option><option>华东区域</option><option>华南区域</option><option>海外区域</option></select>
      <select><option>全部工厂</option><option>一号工厂</option><option>二号工厂</option></select>
      <button onclick="window.print()">导出报告</button>
    </div>
  </div>

  <section class="kpi-layout">
    <aside class="info-panel">
      <div class="kpi-no" id="kpiNo"></div>
      <h2 id="kpiTitle"></h2>
      <div class="target-line">管理目标 <b id="targetValue"></b></div>
      <div class="result-box" id="resultBox">
        <label>当前结果</label>
        <div class="result-main" id="currentValue"></div>
        <div class="result-sub" id="currentSub"></div>
      </div>

      <div class="block">
        <h3>定义</h3>
        <div class="formula" id="definition"></div>
      </div>

      <div class="block">
        <h3>管理层需要关注</h3>
        <ul class="watch-list" id="watchList"></ul>
      </div>

      <div class="block">
        <div class="deep-title">Deep Dive</div>
        <div class="deep-buttons" id="deepButtons"></div>
      </div>
    </aside>

    <div class="chart-panel">
      <div class="chart-head">
        <div><h3 id="chartTitle"></h3><p id="chartSub"></p></div>
        <div class="legend" id="legend"></div>
      </div>
      <div class="chart-wrap"><canvas id="chart"></canvas></div>
      <div class="chart-note">虚线表示管理目标；图中数据为 Demo 模拟数据</div>
    </div>
  </section>
</main>

<div class="modal-bg" id="modalBg" onclick="closeModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-head">
      <div><h3 id="modalTitle"></h3><p id="modalSub"></p></div>
      <button class="close" onclick="closeModal()">×</button>
    </div>
    <div class="modal-body">
      <div class="summary-row" id="summaryRow"></div>
      <table>
        <thead><tr><th>排名</th><th id="dimHeader">维度</th><th>当前值</th><th>贡献 / 风险占比</th><th>趋势</th></tr></thead>
        <tbody id="modalTable"></tbody>
      </table>
    </div>
  </div>
</div>

const keys=['revenue','receivable','material','complaint'];
let active='revenue';

function renderTabs(){
  document.getElementById('tabs').innerHTML=keys.map(k=>`<button class="tab ${active===k?'active':''}" onclick="switchKpi('${k}')">${kpis[k].tab}</button>`).join('');
}

function switchKpi(key){
  active=key; const k=kpis[key];
  renderTabs();
  document.getElementById('kpiNo').textContent=k.no;
  document.getElementById('kpiTitle').textContent=k.title;
  document.getElementById('targetValue').textContent=k.target;
  document.getElementById('currentValue').textContent=k.current;
  document.getElementById('currentSub').textContent=k.sub;
  document.getElementById('definition').innerHTML=k.definition;
  const rb=document.getElementById('resultBox'); rb.className='result-box '+k.box;
  document.getElementById('watchList').innerHTML=k.watch.map(x=>`<li>${x}</li>`).join('');
  document.getElementById('deepButtons').innerHTML=k.buttons.map(x=>`<button onclick="openDeep('${x}')">${x}</button>`).join('');
  document.getElementById('chartTitle').textContent=k.chartTitle;
  document.getElementById('chartSub').textContent=k.chartSub;
  document.getElementById('legend').innerHTML=k.legend.map(x=>`<span><i style="background:${x[0]}"></i>${x[1]}</span>`).join('');
  requestAnimationFrame(()=>drawChart(k));
}

function niceMax(arr){
  const m=Math.max(...arr);
  const pow=Math.pow(10,Math.floor(Math.log10(m)));
  return Math.ceil(m/pow*1.15)*pow;
}

function drawChart(k){
  const cfg=k.chart, d=series[cfg.key], c=document.getElementById('chart');
  const rect=c.getBoundingClientRect(), ratio=window.devicePixelRatio||1;
  c.width=rect.width*ratio;c.height=rect.height*ratio;
  const ctx=c.getContext('2d');ctx.scale(ratio,ratio);
  const W=rect.width,H=rect.height,p={l:52,r:58,t:25,b:54};
  const pw=W-p.l-p.r,ph=H-p.t-p.b,n=series.labels.length;
  const leftVals=(d.bar2?d.bar1.concat(d.bar2):d.bar1);
  const leftMax=niceMax(leftVals);
  const rmin=cfg.rightMin,rmax=cfg.rightMax;
  ctx.clearRect(0,0,W,H);ctx.font='10px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif';
  ctx.textBaseline='middle';

  // Grid and Y labels
  for(let i=0;i<=5;i++){
    const y=p.t+ph*i/5;
    ctx.strokeStyle='#e8ebef';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(p.l,y);ctx.lineTo(W-p.r,y);ctx.stroke();
    const lv=Math.round(leftMax-(leftMax*i/5));
    ctx.fillStyle='#738091';ctx.textAlign='right';ctx.fillText(lv,p.l-8,y);
    const rv=Math.round(rmax-((rmax-rmin)*i/5));
    ctx.textAlign='left';ctx.fillText(rv,W-p.r+8,y);
  }
  ctx.save();
  ctx.fillStyle='#738091';ctx.textAlign='center';
  ctx.translate(12,p.t+ph/2);ctx.rotate(-Math.PI/2);ctx.fillText(cfg.leftUnit,0,0);ctx.restore();
  ctx.save();ctx.translate(W-12,p.t+ph/2);ctx.rotate(Math.PI/2);ctx.fillText(cfg.rightUnit,0,0);ctx.restore();

  const step=pw/n, bw=Math.max(3,Math.min(9,step*(d.bar2?0.34:0.56)));
  const yL=v=>p.t+ph-(v/leftMax)*ph;
  const yR=v=>p.t+ph-((v-rmin)/(rmax-rmin))*ph;

  // bars
  for(let i=0;i<n;i++){
    const cx=p.l+step*i+step/2;
    if(d.bar2){
      ctx.fillStyle=cfg.key==='receivable'?'#d9a05d':'#c78080';
      ctx.fillRect(cx-bw-1,yL(d.bar1[i]),bw,p.t+ph-yL(d.bar1[i]));
      ctx.fillStyle=cfg.key==='receivable'?'#90bdd8':'#d9a05d';
      ctx.fillRect(cx+1,yL(d.bar2[i]),bw,p.t+ph-yL(d.bar2[i]));
    }else{
      ctx.fillStyle='#90bdd8';
      ctx.fillRect(cx-bw/2,yL(d.bar1[i]),bw,p.t+ph-yL(d.bar1[i]));
    }
  }

  // Goal line
  const gy=yR(cfg.goal);
  ctx.save();ctx.setLineDash([5,5]);ctx.strokeStyle='#7a7f87';ctx.lineWidth=1.3;
  ctx.beginPath();ctx.moveTo(p.l,gy);ctx.lineTo(W-p.r,gy);ctx.stroke();ctx.restore();
  ctx.fillStyle='#6d737b';ctx.textAlign='right';ctx.fillText('目标',W-p.r-4,gy-8);

  // line
  ctx.beginPath();
  d.line.forEach((v,i)=>{
    const x=p.l+step*i+step/2,y=yR(v);
    if(i===0)ctx.moveTo(x,y);else ctx.lineTo(x,y);
  });
  ctx.strokeStyle='#3973b7';ctx.lineWidth=2.2;ctx.stroke();

  // selected points and labels
  const labelIdx=[0,7,15,23,31,39,47];
  labelIdx.forEach(i=>{
    const x=p.l+step*i+step/2,y=yR(d.line[i]);
    ctx.beginPath();ctx.arc(x,y,3.2,0,Math.PI*2);ctx.fillStyle='#fff';ctx.fill();
    ctx.strokeStyle='#3973b7';ctx.lineWidth=1.5;ctx.stroke();
    ctx.fillStyle='#405267';ctx.textAlign='center';
    ctx.fillText(d.line[i].toFixed(1),x,y-12);
  });

  // X labels
  const monthLabels=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  monthLabels.forEach((m,idx)=>{
    const i=idx*4+1.5,x=p.l+step*i+step/2;
    ctx.fillStyle='#738091';ctx.textAlign='center';ctx.fillText(m,x,H-28);
  });
  ctx.fillStyle='#738091';ctx.fillText('周次',p.l+pw/2,H-10);
}

function openDeep(dim){
  const k=kpis[active], rows=k.drill[dim];
  document.getElementById('modalTitle').textContent=`${k.title} · ${dim}`;
  document.getElementById('modalSub').textContent='用于从公司级 KPI 下钻定位主要差距、风险和责任范围。';
  document.getElementById('dimHeader').textContent=dim.replace('按','');
  const top=rows[0];
  document.getElementById('summaryRow').innerHTML=`
    <div class="summary-card"><label>当前公司级结果</label><b>${k.current}</b></div>
    <div class="summary-card"><label>最大问题来源</label><b>${top[0]}</b></div>
    <div class="summary-card"><label>最大贡献占比</label><b>${top[2]}</b></div>`;
  document.getElementById('modalTable').innerHTML=rows.map((r,i)=>`
    <tr><td class="rank">${i+1}</td><td><b>${r[0]}</b></td><td>${r[1]}</td>
    <td class="barcell"><div>${r[2]}</div><div class="mini-bar"><div style="width:${parseFloat(r[2])}%"></div></div></td>
    <td>${r[3]}</td></tr>`).join('');
  document.getElementById('modalBg').style.display='block';
}

window.addEventListener('resize',()=>drawChart(kpis[active]));
