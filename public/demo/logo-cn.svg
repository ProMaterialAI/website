<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .logo-stroke {
        fill: none;
        stroke: #D4AF37;
        stroke-width: 8;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
    </style>
  </defs>
  
  <g class="logo-stroke">
    <!-- Outer circle -->
    <circle cx="100" cy="100" r="88"/>
    
    <!-- Left slanted roof/arch -->
    <path d="M 42 110 L 70 50"/>
    
    <!-- Top left arch -->
    <path d="M 70 50 Q 85 35 100 35"/>
    
    <!-- Top right arch -->
    <path d="M 100 35 Q 130 35 155 60"/>
    
    <!-- Right arch down -->
    <path d="M 155 60 Q 158 100 155 140"/>
    
    <!-- Right rounded bottom -->
    <path d="M 155 140 Q 140 155 120 155"/>
    
    <!-- Bottom right building -->
    <path d="M 120 155 L 120 120"/>
    <rect x="110" y="120" width="20" height="35"/>
    
    <!-- Middle bottom -->
    <path d="M 110 155 L 90 155"/>
    
    <!-- Left middle line down -->
    <path d="M 80 120 L 80 155"/>
    
    <!-- Left window -->
    <rect x="60" y="120" width="18" height="25"/>
    
    <!-- Left building bottom -->
    <path d="M 60 120 L 42 120 L 42 110"/>
    
    <!-- Connecting line at bottom -->
    <line x1="80" y1="155" x2="120" y2="155"/>
  </g>
</svg>